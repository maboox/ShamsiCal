[build-system]
requires = ["setuptools>=82,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "shamsical"
version = "2.0.0"
description = "A bilingual, privacy-minded Jalali desktop calendar with notes and RSS"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{name = "ShamsiCal contributors"}]
dependencies = [
  "PyQt6>=6.11,<6.12", "jdatetime>=6.1,<7", "hijridate>=2.6,<3",
  "feedparser>=6.0.14,<7", "qtawesome>=1.4.2,<1.5",
  "urllib3>=2.8,<3", "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-qt>=4.5,<5", "ruff>=0.17,<0.18", "pip-audit>=2.10,<3", "build>=1.6,<2", "pyinstaller>=6.22,<7"]

[project.gui-scripts]
shamsical = "shamsical.app:main"

[project.urls]
Homepage = "https://github.com/maboox/ShamsiCal"
Issues = "https://github.com/maboox/ShamsiCal/issues"
Releases = "https://github.com/maboox/ShamsiCal/releases"

[tool.setuptools.packages.find]
include = ["shamsical*"]

[tool.setuptools.package-data]
shamsical = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt", "assets/licenses/*.txt", "assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
